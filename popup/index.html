<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoastFIRE Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="header">
    <div class="header-brand">
      <img class="brand-icon" src="../icons/icon32.png" alt="" width="28" height="28">
      <span class="brand-name">Coast<span class="brand-fire">FIRE</span> Hub</span>
    </div>
    <span class="header-slogan">Your numbers. Your freedom.</span>
  </header>

  <!-- ── TAB BAR ── -->
  <nav class="tab-bar" role="tablist">
    <button class="tab tab--active" id="tab-btn-calc"
            role="tab" aria-selected="true" aria-controls="panel-calc">
      ⚡ Calculator
    </button>
    <button class="tab tab--disabled" role="tab"
            aria-selected="false" aria-disabled="true" title="Coming in Phase 2">
      📊 Progress
    </button>
    <button class="tab tab--disabled" role="tab"
            aria-selected="false" aria-disabled="true" title="Coming in Phase 2">
      📖 Feed
    </button>
  </nav>

  <!-- ── CALCULATOR PANEL ── -->
  <main class="panel" id="panel-calc" role="tabpanel">

    <!-- Age -->
    <div class="input-row">
      <div class="input-row__header">
        <label class="input-label" for="slider-age">Current Age</label>
        <span class="input-value" id="display-age">32</span>
      </div>
      <input type="range" class="slider" id="slider-age"
             min="18" max="60" step="1" value="32"
             aria-label="Current age">
    </div>

    <!-- Retirement Age -->
    <div class="input-row">
      <div class="input-row__header">
        <label class="input-label" for="slider-ret">Retirement Age</label>
        <span class="input-value" id="display-ret">65</span>
      </div>
      <input type="range" class="slider" id="slider-ret"
             min="45" max="80" step="1" value="65"
             aria-label="Target retirement age">
    </div>

    <!-- Annual Spending -->
    <div class="input-row">
      <div class="input-row__header">
        <label class="input-label" for="slider-spend">Annual Spending</label>
        <span class="input-value" id="display-spend">$60,000</span>
      </div>
      <input type="range" class="slider" id="slider-spend"
             min="20000" max="200000" step="1000" value="60000"
             aria-label="Annual spending in retirement">
    </div>

    <!-- Current Investments -->
    <div class="input-row">
      <div class="input-row__header">
        <label class="input-label" for="slider-assets">Current Investments</label>
        <span class="input-value" id="display-assets">$185,000</span>
      </div>
      <input type="range" class="slider" id="slider-assets"
             min="0" max="2000000" step="1000" value="185000"
             aria-label="Current investment portfolio value">
    </div>

    <!-- Advanced Toggle -->
    <button class="advanced-toggle" id="advanced-toggle"
            aria-expanded="false" aria-controls="advanced-panel">
      ⚙ Advanced settings (7% return · 4% SWR · 3% inflation)
    </button>

    <!-- Advanced Panel (hidden by default) -->
    <div class="advanced-panel" id="advanced-panel" aria-hidden="true">
      <div class="input-row input-row--sm">
        <div class="input-row__header">
          <label class="input-label" for="slider-return">Investment Return</label>
          <span class="input-value" id="display-return">10%</span>
        </div>
        <input type="range" class="slider" id="slider-return"
               min="4" max="15" step="0.5" value="10"
               aria-label="Expected annual investment return (nominal)">
      </div>
      <div class="input-row input-row--sm">
        <div class="input-row__header">
          <label class="input-label" for="slider-inflation">Inflation Rate</label>
          <span class="input-value" id="display-inflation">3%</span>
        </div>
        <input type="range" class="slider" id="slider-inflation"
               min="1" max="8" step="0.5" value="3"
               aria-label="Expected annual inflation rate">
      </div>
      <div class="input-row input-row--sm">
        <div class="input-row__header">
          <label class="input-label" for="slider-swr">Safe Withdrawal Rate</label>
          <span class="input-value" id="display-swr">4%</span>
        </div>
        <input type="range" class="slider" id="slider-swr"
               min="2" max="6" step="0.25" value="4"
               aria-label="Safe withdrawal rate for retirement">
      </div>
    </div>

    <!-- Result Card -->
    <div class="result-card" role="region" aria-label="Coast FIRE calculation result">
      <div class="result-card__label">Coast FIRE Number</div>
      <div class="result-card__number" id="result-number">$176,420</div>
      <div class="result-card__meta" id="result-meta">
        FIRE Target: $1,500,000 · Real Return: 6.8%
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-label">Progress to Coast FIRE</span>
        <span class="progress-pct" id="result-pct">105%</span>
      </div>
      <div class="progress-bar" role="progressbar"
           aria-valuenow="105" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" id="progress-fill" style="width: 100%"></div>
      </div>
    </div>

    <!-- Status Badge -->
    <div class="status-badge status-badge--reached" id="status-badge">
      <span class="status-icon">✓</span>
      <span id="status-text">You've reached Coast FIRE! You can stop saving aggressively.</span>
    </div>

    <!-- CTA Button -->
    <button class="cta-btn" id="btn-open-site">
      Open Full Calculator with Charts ↗
    </button>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <a href="https://coastfirehub.com" class="footer-link"
       target="_blank" rel="noopener noreferrer">
      coastfirehub.com
    </a>
    <span class="footer-version">v1.0.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
